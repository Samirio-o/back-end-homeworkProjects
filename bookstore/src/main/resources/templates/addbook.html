<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Bookstore - Add Book</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>

<body>
    <h1>Add Book</h1>
    <div>
        <form th:object="${book}" th:action="@{/save}" action="#" method="post">
            <input type="hidden" th:field="*{id}" />
            <!-- Hidden field for the book ID, used for editing existing books -->

            <label for="title">Title</label>
            <input type="text" id="title" th:field="*{title}" />
            <label for="author">Author</label>
            <input type="text" id="author" th:field="*{author}" />
            <label for="isbn">ISBN</label>
            <input type="text" id="isbn" th:field="*{isbn}" />
            <label for="publicationYear">Year</label>
            <input type="text" id="publicationYear" th:field="*{publicationYear}" />
            <label for="price">Price</label>
            <input type="text" id="price" th:field="*{price}" />
            <label for="category">Category</label>
            <select id="category" th:field="*{category}">
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
            <input type="submit" value="Save"></input>
        </form>
    </div>
</body>

</html>
