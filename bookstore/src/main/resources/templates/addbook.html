<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bookstore - Add Book</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
    <h1>Add Book</h1>
    
    <form action="#" th:action="@{/save}" th:object="${book}" method="post">
        <label for="title">Title:</label>
        <input type="text" id="title" th:field="*{title}" />
        <br/><br/>
        
        <label for="author">Author:</label>
        <input type="text" id="author" th:field="*{author}" />
        <br/><br/>
        
        <label for="isbn">ISBN:</label>
        <input type="text" id="isbn" th:field="*{isbn}" />
        <br/><br/>
        
        <label for="publicationYear">Year:</label>
        <input type="text" id="publicationYear" th:field="*{publicationYear}" />
        <br/><br/>

        <label for="price">Price:</label>
        <input type="text" id="price" th:field="*{price}" />
        <br/><br/>
        
        <input type="submit" value="Save" />
    </form>

</body>
</html>
