spring.application.name=bookstore
# Prints SQL queries generated by JPA to the console
spring.jpa.show-sql=true
# Enables the H2 database console visible at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Sets a static URL for the H2 console database named testdb on every application start
spring.datasource.url=jdbc:h2:mem:testdb