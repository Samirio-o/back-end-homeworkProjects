<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Friend Single Page</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
    <h1>Friend List</h1>

    <!-- friend list -->
    <div th:each="friend : ${friends}">
        <p th:text="${friend.firstName} + ' ' + ${friend.lastName}"></p>
    </div>

    <!-- add friend form -->
    <h2>Add Friend</h2>
    <form th:action="@{/friendSinglePage}" th:object="${friend}" method="post">
        <p>First name: <input type="text" th:field="*{firstName}" /></p>
        <p>Last name: <input type="text" th:field="*{lastName}" /></p>
        <p><input type="submit" value="Add" /></p>
    </form>
</body>
</html>
